name: Build and Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main  # Adjust this to your branch

permissions:
  contents: write  # Allow pushing to gh-pages branch
  pages: write    # Allow deploying to GitHub Pages
  id-token: write  # Allow OIDC token for GitHub Pages

jobs:
  build:
    name: Build-Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.0.0'   # Use Node 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 
      
      - name: Build project
        run: npm run build  -- --configuration production --base-href /
        # 🔥 IMPORTANT:   Please tell me who you are.  
      - name: Configure Git (fix "Author unknown")
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      # 🔥 IMPORTANT:    secrets.GITHUB_TOKEN   
      # On GitHub Pages, the default publishing directory is root.(WE CAN SEE IT IN SETTINGS > PAGES)  
      # Steps: 
      - name: GitHub Pages (This updates the gh-pages branch automatically)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}        
        run: npm run deploy # Adjust this if your build output is in a different directory

  upload-job:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Just to play with variables (Step 0)
        run: echo "The build job ran on ${{secrets.GITHUB_TOKEN}}"
      - name: Another step to play with secrets (Step 1)
        run: echo "GITHUB_TOKEN  ${{secrets.GITHUB_TOKEN}}"           
      - name: List Files in  (Step 2)
        run: ls -la ./
  
  dansy-job:
     needs: build
     runs-on: ubuntu-latest
     steps:
      - name: Just to play with variables (Step 0)
        run: echo "The build job ran on ${{secrets.GITHUB_TOKEN}}"
      - name: Another step to play with secrets (Step 1)
        run: echo "GITHUB_TOKEN  ${{secrets.GITHUB_TOKEN}}"           
      - name: List Files in  (Step 2)
        run: ls -la ./

  deploy-test:
    needs: build
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Just to play with variables (Step 0)
        run: echo "The build job ran on ${{secrets}}"
 
  ghislain-job:
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Just to play with variables (Step 0)
        run: echo "The build job ran on ${{secrets}}"
      - name: List ALL (Step 1)
        run: tree ./
      - name: Display Tree of current directory (Step 2)
        run:  pwd  
      - name: List Directories (Step 3)
        run: tree /home/runner/work/ 
      - name: List Files in  (Step 4)
        run: cd /home/runner/work/ghislain1.github.io/ghislain1.github.io && ls -laR
      - name: CURRENT DIRECTORY (Step 5)
        run: pwd
      - name: FInd docs directory (Step 6)
        run:  find . -type d -name "docs"
 