<section class="resume-section" id="education">
  <div class="resume-section-content">
    <h2 class="mb-5 section-title">
      <i class="fas fa-graduation-cap me-3"></i>
      Education
    </h2>
    
    @for (edu of educationList; track edu.school) {
    <div class="education-card glass-card">
      <div class="d-flex flex-column flex-md-row justify-content-between">
        <div class="flex-grow-1">
          <div class="d-flex align-items-center mb-3">
            <div class="education-icon me-3">
              <i [class]="edu.icon"></i>
            </div>
            <div>
              <h3 class="mb-1">{{ edu.school }}</h3>
              <div class="subheading">{{ edu.degree }}</div>
              <div class="field">{{ edu.field }}</div>
            </div>
          </div>
          @if (edu.details) {
          <div class="details-badge">
            <i class="fas fa-chart-line me-2"></i>
            {{ edu.details }}
          </div>
          }
        </div>
        <div class="flex-shrink-0 mt-3 mt-md-0">
          <span class="period-badge">{{ edu.period }}</span>
        </div>
      </div>
    </div>
    }
  </div>
</section>
