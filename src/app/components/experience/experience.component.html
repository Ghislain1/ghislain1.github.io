<section class="resume-section" id="experience">
  <div class="resume-section-content">
    <h2 class="mb-5 section-title">
      <i class="fas fa-briefcase me-3"></i>
      Experience
    </h2>
    
    @for (exp of experiences; track exp.title) {
    <div class="experience-card glass-card">
      <div class="d-flex flex-column flex-md-row justify-content-between mb-4">
        <div class="flex-grow-1">
          <div class="d-flex align-items-center mb-3">
            <div class="experience-icon me-3">
              <i [class]="exp.icon"></i>
            </div>
            <div>
              <h3 class="mb-1">{{ exp.title }}</h3>
              <div class="subheading">
                {{ exp.company }}
                @if (exp.companyUrl) {
                <a class="company-link ms-2" [href]="exp.companyUrl" target="_blank">
                  <i class="fa-solid fa-external-link-alt"></i>
                </a>
                }
              </div>
            </div>
          </div>
          <p class="description">{{ exp.description }}</p>
        </div>
        <div class="flex-shrink-0">
          <span class="period-badge">{{ exp.period }}</span>
        </div>
      </div>
    </div>
    }
  </div>
</section>
