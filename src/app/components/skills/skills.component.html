<section class="resume-section" id="skills">
  <div class="resume-section-content">
    <h2 class="mb-5 section-title">
      <i class="fas fa-code me-3"></i>
      Skills
    </h2>

    @for (category of skillCategories; track category.name) {
    <div class="skill-category mb-5">
      <h3 class="category-title">
        <i [class]="category.icon + ' me-2'"></i>
        {{ category.name }}
      </h3>
      
      @for (skill of category.skills; track skill.name) {
      <div class="skill-progress">
        <div class="skill-info">
          <span class="skill-name">{{ skill.name }}</span>
          <span class="skill-percent">{{ skill.percent }}%</span>
        </div>
        <div class="progress-bar-container">
          <div 
            class="progress-bar-fill" 
            [style.width.%]="skill.percent"
            [attr.data-percent]="skill.percent"
          >
          </div>
        </div>
      </div>
      }
    </div>
    }

    <div class="tech-stack mt-5">
      <h3 class="category-title mb-4">
        <i class="fas fa-layer-group me-2"></i>
        Tech Stack
      </h3>
      <div class="tech-icons">
        @for (item of devIcons; track item.icon) {
        <div class="tech-icon-wrapper" [attr.data-label]="item.label">
          <i [class]="item.icon"></i>
        </div>
        }
      </div>
    </div>
  </div>
</section>
